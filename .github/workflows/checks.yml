# A Vercel Deployment Check on the checks job, once configured, holds a push to main back from production until the job passes.
name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Installs pnpm from packageManager and Node from devEngines.runtime in package.json.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:browser
