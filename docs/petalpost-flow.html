<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petalpost Flow</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --color-paper: #f5f5f5;
        --color-ink: #2d3142;
        --color-muted: #4f5d75;
        --color-accent: #bf4520;
        --font-sans: 'Geist', system-ui, sans-serif;
        --font-serif: 'Instrument Serif', 'Noto Serif', serif;
        --font-mono: 'Geist Mono', ui-monospace, monospace;
      }
      body {
        font-family: var(--font-sans);
        background: var(--color-paper);
        color: var(--color-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 2rem;
      }
      /* Cap the width so the 960 by 840 diagram, heading and padding fit one screen height. */
      .frame {
        max-width: min(1200px, calc((100vh - 14rem) * 1.14));
        width: 100%;
      }
      .diagram-container {
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--color-muted);
        margin-bottom: 0.5rem;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin-bottom: 1.5rem;
      }
      svg {
        width: 100%;
        min-width: 960px;
        display: block;
      }
      .zone {
        font-family: var(--font-mono);
        font-size: 8px;
        letter-spacing: 0.14em;
        fill: #4f5d75;
      }
      .name {
        font-family: var(--font-sans);
        font-size: 12px;
        font-weight: 600;
        fill: #2d3142;
        text-anchor: middle;
      }
      .sub {
        font-family: var(--font-mono);
        font-size: 9px;
        fill: #4f5d75;
        text-anchor: middle;
      }
      .lbl {
        font-family: var(--font-mono);
        font-size: 8px;
        letter-spacing: 0.06em;
        fill: #4f5d75;
        text-anchor: middle;
      }
      .lbl-a {
        fill: #bf4520;
      }
      .lbl-l {
        fill: #2e5aa8;
      }
      .note {
        font-family: var(--font-mono);
        font-size: 9px;
        fill: #4f5d75;
      }
      ::selection {
        background: #f2c9b8;
        color: #2d3142;
        fill: #2d3142;
      }
      @media print {
        .diagram-container {
          overflow-x: visible;
        }
        svg {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="eyebrow">Architecture · Petalpost</p>
      <h1>From local development to production, and what runs there</h1>
      <div class="diagram-container">
        <svg
          viewBox="0 0 960 840"
          xmlns="http://www.w3.org/2000/svg"
          role="img"
          aria-labelledby="petalpost-flow-title petalpost-flow-desc"
        >
          <title id="petalpost-flow-title">Petalpost development, deployment and execution flow</title>
          <desc id="petalpost-flow-desc">
            In local development, the developer's browser talks to a local server that serves the pages and the API, and
            the API stores data in a local database. A git push reaches GitHub, which triggers Vercel to install and
            build the project and publish the static pages to its edge network and the API as a function. On each visit,
            the host's and the guests' browsers load the pages from the edge network and call the API function, which
            stores invitations and replies in Neon Postgres. The host shares the invitation link with the guests outside
            Petalpost, and the pages send pageviews to Vercel Web Analytics.
          </desc>
          <defs>
            <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#4f5d75" />
            </marker>
            <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#bf4520" />
            </marker>
            <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
              <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" />
            </marker>
          </defs>
          <rect width="100%" height="100%" fill="#f5f5f5" />

          <rect
            x="24"
            y="30"
            width="912"
            height="170"
            rx="6"
            fill="#ebebeb"
            stroke="#2d3142"
            stroke-opacity="0.12"
            stroke-width="0.8"
          />
          <text class="zone" x="40" y="50">1. LOCAL DEVELOPMENT</text>
          <rect
            x="24"
            y="230"
            width="912"
            height="190"
            rx="6"
            fill="#ebebeb"
            stroke="#2d3142"
            stroke-opacity="0.12"
            stroke-width="0.8"
          />
          <text class="zone" x="40" y="250">2. DEPLOYMENT, ON EACH PUSH</text>
          <rect
            x="24"
            y="450"
            width="912"
            height="330"
            rx="6"
            fill="#ebebeb"
            stroke="#2d3142"
            stroke-opacity="0.12"
            stroke-width="0.8"
          />
          <text class="zone" x="40" y="470">3. EXECUTION, ON EACH VISIT</text>

          <rect x="40" y="80" width="150" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
          <text class="name" x="115" y="110">Developer browser</text>
          <text class="sub" x="115" y="126">localhost</text>
          <rect x="270" y="80" width="150" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
          <text class="name" x="345" y="110">Local server</text>
          <text class="sub" x="345" y="126">pages and API</text>
          <rect x="500" y="80" width="150" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
          <text class="name" x="575" y="110">Local database</text>
          <text class="sub" x="575" y="126">PGlite on disk</text>
          <line x1="190" y1="112" x2="268" y2="112" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)" />
          <rect x="200" y="92" width="58" height="12" rx="2" fill="#ebebeb" />
          <text class="lbl lbl-l" x="229" y="101">HTTP</text>
          <line x1="420" y1="112" x2="498" y2="112" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)" />
          <rect x="430" y="92" width="58" height="12" rx="2" fill="#ebebeb" />
          <text class="lbl lbl-l" x="459" y="101">SQL</text>
          <text class="note" x="40" y="170">
            The local server sends the same headers and routes as Vercel. The automated tests run against it.
          </text>
          <text class="note" x="40" y="186">Local replies stay in the local database and never reach Neon.</text>

          <rect x="40" y="280" width="150" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
          <text class="name" x="115" y="310">Local repo</text>
          <text class="sub" x="115" y="326">pages, API, migrations</text>
          <rect x="270" y="280" width="150" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
          <text class="name" x="345" y="310">GitHub</text>
          <text class="sub" x="345" y="326">mdulea/petalpost</text>
          <rect x="500" y="280" width="150" height="64" rx="6" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.2" />
          <text class="name" x="575" y="310">Vercel build</text>
          <text class="sub" x="575" y="326">install, then build</text>
          <line
            x1="190"
            y1="312"
            x2="268"
            y2="312"
            stroke="#bf4520"
            stroke-width="1.2"
            marker-end="url(#arrow-accent)"
          />
          <rect x="200" y="292" width="58" height="12" rx="2" fill="#ebebeb" />
          <text class="lbl lbl-a" x="229" y="301">GIT PUSH</text>
          <line
            x1="420"
            y1="312"
            x2="498"
            y2="312"
            stroke="#bf4520"
            stroke-width="1.2"
            marker-end="url(#arrow-accent)"
          />
          <rect x="430" y="292" width="58" height="12" rx="2" fill="#ebebeb" />
          <text class="lbl lbl-a" x="459" y="301">WEBHOOK</text>
          <text class="note" x="40" y="372">
            The build keeps only the site files, so no URL serves tooling, server code or documentation.
          </text>
          <text class="note" x="40" y="388">
            Pushes to main deploy to production; other branches get preview URLs behind Vercel login.
          </text>
          <text class="note" x="40" y="404">
            Database schema changes run by hand against Neon before the deploy that needs them.
          </text>

          <line
            x1="575"
            y1="344"
            x2="575"
            y2="488"
            stroke="#bf4520"
            stroke-width="1.2"
            marker-end="url(#arrow-accent)"
          />
          <rect x="583" y="429" width="58" height="12" rx="2" fill="#f5f5f5" />
          <text class="lbl lbl-a" x="612" y="438">PUBLISH</text>

          <rect
            x="486"
            y="490"
            width="178"
            height="226"
            rx="6"
            fill="none"
            stroke="#bf4520"
            stroke-opacity="0.5"
            stroke-width="1"
          />
          <text class="zone" x="498" y="506">VERCEL</text>
          <rect x="500" y="516" width="150" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
          <text class="name" x="575" y="546">Edge CDN</text>
          <text class="sub" x="575" y="562">static pages</text>
          <rect x="500" y="636" width="150" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
          <text class="name" x="575" y="666">API function</text>
          <text class="sub" x="575" y="682">same origin</text>

          <rect x="40" y="516" width="150" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
          <text class="name" x="115" y="546">Host browser</text>
          <text class="sub" x="115" y="562">editor, management</text>
          <rect x="40" y="636" width="150" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
          <text class="name" x="115" y="666">Guest browser</text>
          <text class="sub" x="115" y="682">invitation, reply</text>
          <line x1="115" y1="580" x2="115" y2="634" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" />
          <rect x="123" y="602" width="62" height="12" rx="2" fill="#ebebeb" />
          <text class="lbl" x="154" y="611">SHARES LINK</text>

          <line x1="190" y1="548" x2="498" y2="548" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)" />
          <line x1="190" y1="668" x2="498" y2="668" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)" />
          <line x1="230" y1="548" x2="230" y2="668" stroke="#2e5aa8" stroke-width="1.2" />
          <rect x="336" y="528" width="58" height="12" rx="2" fill="#ebebeb" />
          <text class="lbl lbl-l" x="365" y="537">PAGES</text>
          <rect x="336" y="648" width="58" height="12" rx="2" fill="#ebebeb" />
          <text class="lbl lbl-l" x="365" y="657">API CALLS</text>

          <rect
            x="730"
            y="516"
            width="150"
            height="64"
            rx="6"
            fill="#f5f5f5"
            stroke="#2d3142"
            stroke-dasharray="5 4"
            stroke-width="1"
          />
          <text class="name" x="805" y="546">Web Analytics</text>
          <text class="sub" x="805" y="562">pageviews</text>
          <line
            x1="650"
            y1="548"
            x2="728"
            y2="548"
            stroke="#4f5d75"
            stroke-width="1.2"
            stroke-dasharray="5 4"
            marker-end="url(#arrow)"
          />
          <rect x="660" y="528" width="58" height="12" rx="2" fill="#ebebeb" />
          <text class="lbl" x="689" y="537">PAGEVIEW</text>
          <rect x="730" y="636" width="150" height="64" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" />
          <text class="name" x="805" y="666">Neon Postgres</text>
          <text class="sub" x="805" y="682">invitations, replies</text>
          <line x1="650" y1="668" x2="728" y2="668" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)" />
          <rect x="660" y="648" width="58" height="12" rx="2" fill="#ebebeb" />
          <text class="lbl lbl-l" x="689" y="657">SQL</text>

          <text class="note" x="40" y="740">
            The host publishes from the editor, shares the invitation link and reads the replies on the management page.
          </text>
          <text class="note" x="40" y="756">
            Guests open the link, read the invitation and send or edit their reply.
          </text>
          <text class="note" x="40" y="772">
            The host's browser keeps the draft, the photo and the management secret in local storage.
          </text>

          <line x1="30" y1="800" x2="930" y2="800" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8" />
          <text class="zone" x="30" y="818">LEGEND</text>
          <line x1="100" y1="815" x2="130" y2="815" stroke="#bf4520" stroke-width="1.2" />
          <text class="note" x="138" y="818">deploy path</text>
          <line x1="260" y1="815" x2="290" y2="815" stroke="#2e5aa8" stroke-width="1.2" />
          <text class="note" x="298" y="818">network request</text>
          <line x1="420" y1="815" x2="450" y2="815" stroke="#4f5d75" stroke-width="1.2" />
          <text class="note" x="458" y="818">step outside Petalpost</text>
          <line x1="620" y1="815" x2="650" y2="815" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5 4" />
          <text class="note" x="658" y="818">background beacon</text>
        </svg>
      </div>
    </div>
  </body>
</html>
